[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proofgate-ops"
version = "0.2.0"
description = "Evidence-gated multi-app operations agent for Gmail, Google Drive, and GitHub"
requires-python = ">=3.11"
authors = [{name = "Hackathon participant"}]
license = {text = "MIT"}

[project.scripts]
proofgate = "proofgate.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
